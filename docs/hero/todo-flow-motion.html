<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TODO Flow - 체크 하나가 흐름이 되기까지 (32s)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=block">
<style>
  html,body{margin:0;height:100%;background:#0b0b0b;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,177.78vh);height:auto;aspect-ratio:16/9;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* "체크 하나가 흐름이 되기까지" - one green stroke runs through the whole film.
   backlog page -> your checkmarks pick 3 tracks -> each becomes a worktree lane walked by an agent
   -> the session ends but the files stay -> a different agent picks them up -> verify / independent review
   -> lanes land on main -> triage loops a follow-up back as an unchecked box -> that box becomes the logo.
   render(t) is deterministic. Click to pause. ?t=12.5 freezes a frame. ?lang=en switches the copy. */
const W=1920,H=1080,FPS=30,DUR=32;
const Q=new URLSearchParams(location.search);
const LANG=Q.get('lang')==='en'?'en':'ko';
document.documentElement.lang=LANG;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={paper:'#f5f7f3',card:'#ffffff',ink:'#1d3429',ink2:'#53605b',rule:'#d6e0d9',green:'#257854',greenL:'#90d7b0',greenBg:'#eaf2ed',
  amber:'#d4a34b',amberDeep:'#7b5a16',amberBg:'#fff0cc',claude:'#d97757',codex:'#4f86d6',violet:'#7a5cc2',night:'#0c1a14',cream:'#f1ead9'};
const PF='"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif';
const GF='Gaegu,"Malgun Gothic",cursive';
const MF='"SF Mono",SFMono-Regular,Menlo,Consolas,monospace';

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry(1);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const eback=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const J=a=>(R()*2-1)*a;
function rgb(h){if(h[0]==='#'){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}return h.match(/[\d.]+/g).slice(0,3).map(Number)}
function hexA(h,a){const[r,g,b]=rgb(h);return`rgba(${r|0},${g|0},${b|0},${clamp(a)})`}
function mix(h1,h2,t){const a=rgb(h1),b=rgb(h2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],clamp(t)))).join(',')})`}

/* ---------- copy ---------- */
const S={
  ko:{rows:['로그 포맷 정리','재시도 백오프 추가','설정 파일 검증','에러 메시지 개선','캐시 만료 처리','문서 링크 수정','대시보드 필터','빌드 시간 단축','권한 점검'],
    a1:'할 일은 쌓여 가고,',a2:'고르는 건 당신.',
    b:'이어가는 건 에이전트.',bs:'선택한 트랙마다 각자의 worktree에서, 병렬로.',
    c1:'세션이 끝나도, 파일은 남습니다.',c2:'다음 에이전트가 그 자리에서 이어받습니다.',
    files:['결과','질문','근거'],steps:['정확한 후보 검증','독립 리뷰','반영'],
    d2:'후속 작업은 다시, 당신의 선택을 기다립니다.',follow:'후속: 재시도 지표 보강',wait:'선택 대기',stamp:'통과',
    tag:'할 일을 고르면, 에이전트가 이어서 진행합니다.',cmd0:'todo 재시도 백오프를 추가하고 테스트까지',ended:'— 세션 종료 —'},
  en:{rows:['Tidy the log format','Add retry backoff','Validate config files','Clearer error message','Handle cache expiry','Fix doc links','Dashboard filter','Speed up the build','Audit permissions'],
    a1:'The backlog keeps growing.',a2:'You pick the work.',
    b:'Agents carry it forward.',bs:'Each selected track in its own worktree, in parallel.',
    c1:'Sessions end. The files stay.',c2:'The next agent picks up where the last one stopped.',
    files:['results','questions','evidence'],steps:['Exact-head verify','Independent review','Land'],
    d2:'Follow-ups wait for your pick.',follow:'Follow-up: retry metrics',wait:'awaiting pick',stamp:'passed',
    tag:'Pick the work. Let agents carry it forward.',cmd0:'todo Add bounded retries, with tests.',ended:'— session ended —'}}[LANG];
const IDS=['retry-backoff','request-error-message','dashboard-filter'];
const SHA=['a3f9c1e','7be204d','c91f5a0'];
const CYCLE=['todo','trackpicks','trackrun','watchlist','todo'];

/* ---------- hand-drawn primitives ---------- */
function rline(x1,y1,x2,y2,{w=3,col=C.ink,j=2.2,passes=2}={}){
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  const len=Math.hypot(x2-x1,y2-y1)||1,nx=-(y2-y1)/len,ny=(x2-x1)/len;
  for(let p=0;p<passes;p++){
    ctx.lineWidth=w*(p?0.55:1);
    const bow=J(Math.min(len*0.01+j,8)),mx=(x1+x2)/2+nx*bow,my=(y1+y2)/2+ny*bow;
    ctx.beginPath();ctx.moveTo(x1+J(j),y1+J(j));ctx.quadraticCurveTo(mx+J(j),my+J(j),x2+J(j),y2+J(j));ctx.stroke();
  }
}
function rpoly(pts,closed,o){for(let i=0;i<pts.length-(closed?0:1);i++){const a=pts[i],b=pts[(i+1)%pts.length];rline(a[0],a[1],b[0],b[1],o)}}
function rellipse(cx,cy,rx,ry,{w=3,col=C.ink,j=2,passes=2,rot=0,from=0,to=1}={}){
  if(to-from<=0.0005)return;
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  for(let p=0;p<passes;p++){
    ctx.lineWidth=w*(p?0.55:1);
    const N=Math.max(18,Math.ceil((rx+ry)*0.12*(to-from))+6),ph=R()*6.283,amp=j*(p?1.4:1),off=J(0.012);
    ctx.beginPath();
    for(let i=0;i<=N;i++){const u=from+(to-from)*i/N,a=u*6.283+rot+off,d=Math.sin(a*3+ph)*amp+J(j*.35);
      const x=cx+Math.cos(a)*(rx+d),y=cy+Math.sin(a)*(ry+d);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.stroke();
  }
}
function hatch(pathFn,{angle=-0.8,gap=12,col=C.ink,w=1.5,j=1.5,bbox}={}){
  ctx.save();ctx.beginPath();pathFn();ctx.clip();
  const[x0,y0,x1,y1]=bbox,cx=(x0+x1)/2,cy=(y0+y1)/2,r=Math.hypot(x1-x0,y1-y0)/2+10;
  ctx.translate(cx,cy);ctx.rotate(angle);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();for(let y=-r;y<r;y+=gap){ctx.moveTo(-r+J(j*3),y+J(j));ctx.lineTo(r+J(j*3),y+J(j))}ctx.stroke();ctx.restore();
}
function font(size,weight,fam){if(fam==='G')size*=1.35;return[`${weight} ${size}px ${fam==='P'?PF:fam==='G'?GF:MF}`,size]}
function tw(s,{size=48,weight=700,fam='P'}={}){ctx.save();ctx.font=font(size,weight,fam)[0];const w=ctx.measureText(s).width;ctx.restore();return w}
function txt(s,x,y,{size=48,weight=700,fam='P',col=C.ink,align='left',rev=1,alpha=1,rot=0}={}){
  const[f,sz]=font(size,weight,fam);
  ctx.save();ctx.font=f;const w=ctx.measureText(s).width;
  if(rev<=0||alpha<=0){ctx.restore();return w}
  ctx.globalAlpha*=alpha;ctx.textBaseline='alphabetic';ctx.translate(x+J(0.7),y+J(0.7));ctx.rotate(rot);
  const x0=align==='center'?-w/2:align==='right'?-w:0;
  if(rev<1){ctx.beginPath();ctx.rect(x0-12,-sz*1.15,(w+24)*rev,sz*1.7);ctx.clip()}
  ctx.fillStyle=col;ctx.fillText(s,x0,0);ctx.restore();return w;
}
function asterisk(x,y,r,col,p){if(p<=0)return;for(let k=0;k<3;k++){const a=k*Math.PI/3+.3;rline(x-Math.cos(a)*r*p,y-Math.sin(a)*r*p,x+Math.cos(a)*r*p,y+Math.sin(a)*r*p,{col,w:4,j:1,passes:1})}}
function checkbox(x,y,s,{col=C.ink,w=3,fill=C.card}={}){
  ctx.fillStyle=fill;ctx.fillRect(x-s/2,y-s/2,s,s);
  rpoly([[x-s/2,y-s/2],[x+s/2,y-s/2],[x+s/2,y+s/2],[x-s/2,y+s/2]],true,{col,w,j:Math.min(1.2,s*.03),passes:2});
}
const checkPts=(x,y,s)=>[[x-s*.36,y],[x-s*.08,y+s*.32],[x+s*.62,y-s*.62]];
function checkPath(x,y,s,p){
  const P=checkPts(x,y,s),L1=Math.hypot(P[1][0]-P[0][0],P[1][1]-P[0][1]),L2=Math.hypot(P[2][0]-P[1][0],P[2][1]-P[1][1]),d=clamp(p)*(L1+L2);
  if(d<=L1)return[P[0],[lerp(P[0][0],P[1][0],d/L1),lerp(P[0][1],P[1][1],d/L1)]];
  return[P[0],P[1],[lerp(P[1][0],P[2][0],(d-L1)/L2),lerp(P[1][1],P[2][1],(d-L1)/L2)]];
}
function check(x,y,s,p,{col=C.green,w=7}={}){
  if(p<=0)return;const pts=checkPath(x,y,s,p);ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  for(let pass=0;pass<2;pass++){ctx.lineWidth=w*(pass?.45:1);ctx.beginPath();
    pts.forEach((q,i)=>{const X=q[0]+J(1)+pass*2,Y=q[1]+J(1)-pass;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke()}
}
function fitSize(s,size,weight,maxW,fam='P'){const w=tw(s,{size,weight,fam});return w>maxW?size*maxW/w:size}

/* ---------- paths ---------- */
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,len:L[L.length-1]}}
function at(P,s){const{pts,L}=P;s=clamp(s,0,P.len);let lo=0,hi=L.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(L[m]<=s)lo=m;else hi=m}
  const u=(s-L[lo])/((L[hi]-L[lo])||1);return[lerp(pts[lo][0],pts[hi][0],u),lerp(pts[lo][1],pts[hi][1],u)]}
function cubic(p0,p1,p2,p3,u){const v=1-u;return[0,1].map(k=>v*v*v*p0[k]+3*v*v*u*p1[k]+3*v*u*u*p2[k]+u*u*u*p3[k])}
function strokePath(P,s0,s1,step=10){ctx.beginPath();let first=true;for(let s=s0;s<=s1+.01;s+=step){const[x,y]=at(P,Math.min(s,s1));first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false}ctx.stroke()}

/* ---------- textures ---------- */
function makeGrain(seed){const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d');const d=g.createImageData(960,540);const r=mulberry(seed);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=r()<.35?(r()*30|0):0}g.putImageData(d,0,0);return c}
const GRAIN=[makeGrain(11),makeGrain(22),makeGrain(33)];
function makeHatchBg(seed){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const r=mulberry(seed);
  g.strokeStyle='rgba(60,100,80,0.05)';g.lineWidth=1.4;g.beginPath();for(let k=-H;k<W;k+=17){const o=(r()-.5)*4;g.moveTo(k+o,H);g.lineTo(k+H+o,0)}g.stroke();return c}
const HBG=[makeHatchBg(5),makeHatchBg(6)];
const VIG=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const gr=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.2)');g.fillStyle=gr;g.fillRect(0,0,W,H);return c})();
const STARS=(()=>{const r=mulberry(3),a=[];for(let i=0;i<70;i++)a.push([r()*W,20+r()*250,1+r()*2.4,r()]);return a})();

/* ---------- layout & timing ---------- */
const ROWX=178,ROW0=252,ROWH=72,TX=44,GS=.78,rowY=k=>ROW0+k*ROWH;
const SEL=[1,3,6],LY=[340,540,740],MAINY=900;
const WX0=640,WX1=1300,GATE=1450,MX=[1770,1670,1570];
const FOLLOW=[190,1000];
const WR=k=>[.4+k*.3,.62+k*.3];            // row k is written
const CK=j=>[3.9+j*.45,4.2+j*.45];         // selected row j is checked
const LANDP=LY.map((y,j)=>{const pts=[[WX1,y],[GATE,y]];for(let i=1;i<=40;i++)pts.push(cubic([GATE,y],[MX[j],y],[MX[j],y],[MX[j],MAINY],i/40));return mkPath(pts)});
const KF=[[[8.2,0],[12.9,.52],[16.5,.52],[18.5,1]],
          [[8.4,0],[10.2,.22],[11.6,.22],[12.9,.4],[16.6,.4],[18.7,1]],
          [[8.6,0],[12.9,.6],[16.7,.6],[18.9,1]]];
function laneP(j,t){const K=KF[j];if(t<=K[0][0])return 0;for(let i=1;i<K.length;i++)if(t<=K[i][0])return lerp(K[i-1][1],K[i][1],(t-K[i-1][0])/(K[i][0]-K[i-1][0]));return K[K.length-1][1]}
const workerX=(j,t)=>lerp(WX0,WX1,laneP(j,t));
const moving=(j,t)=>laneP(j,t+.05)>laneP(j,t-.05)+1e-4;
const bobY=(j,t)=>moving(j,t)?-Math.abs(Math.sin(t*14))*5:0;
const dark=t=>eio(prog(t,13.3,14.0))*(1-eio(prog(t,15.7,16.3)));
const laneAlpha=t=>(1-.62*eio(prog(t,22.9,23.5)))*(1-prog(t,24.6,25.3));
const cardR=j=>Math.max(540,160+(TX+tw(S.rows[SEL[j]],{size:32,fam:'G'}))*GS+34);
const CREW=[['claude','codex','claude'],['codex','claude','codex']];
const WCOL={claude:C.claude,codex:C.codex};

/* ---------- Scene A (0-7s): 백로그 노트 -> 체크 세 개 ---------- */
function page(t){
  const a=eout(prog(t,0,.45))*(1-prog(t,5.8,6.6));if(a<=0)return;
  const x0=112,y0=150,x1=800,y1=880;
  ctx.save();ctx.globalAlpha=a;ctx.translate(456,515);const s=lerp(.96,1,a);ctx.scale(s,s);ctx.translate(-456,-515);
  ctx.fillStyle=hexA(C.ink,.07);ctx.fillRect(x0+10,y0+12,x1-x0,y1-y0);
  ctx.fillStyle=C.card;ctx.fillRect(x0,y0,x1-x0,y1-y0);
  for(let k=0;k<9;k++)rline(x0+14,rowY(k)+18,x1-14,rowY(k)+18,{col:C.rule,w:2,j:.8,passes:1});
  rline(142,y0+8,142,y1-8,{col:hexA(C.claude,.45),w:2.2,j:.8,passes:1});
  rpoly([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],true,{col:C.ink,w:3,j:1.2});
  txt('todo/',ROWX-14,206,{size:24,weight:800,fam:'M',col:C.green});
  ctx.save();ctx.translate(456,y0);ctx.rotate(-.04);ctx.fillStyle=hexA(C.amber,.45);ctx.fillRect(-70,-16,140,32);ctx.restore();
  ctx.restore();
}
function row(label,x,y,{sc=1,alpha=1,box=1,text=1,hi=0,chk=0}={}){
  if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.scale(sc,sc);
  if(hi>0){const w=tw(label,{size:32,fam:'G'});ctx.fillStyle=hexA(C.amber,.34);ctx.beginPath();
    ctx.moveTo(TX-10,-32);ctx.lineTo(TX-10+(w+22)*hi,-34);ctx.lineTo(TX-10+(w+22)*hi,6);ctx.lineTo(TX-10,8);ctx.closePath();ctx.fill()}
  if(box>0){ctx.save();ctx.translate(0,-12);ctx.scale(box,box);checkbox(0,0,34);ctx.restore()}
  txt(label,TX,0,{size:32,fam:'G',col:C.ink,rev:text});
  check(0,-12,34,chk);
  ctx.restore();
}
function backlog(t){
  const al=1-prog(t,5.3,5.9);if(al<=0)return;
  for(let k=0;k<9;k++){if(SEL.includes(k))continue;const[a,b]=WR(k);if(t<a-.1)continue;
    row(S.rows[k],ROWX,rowY(k),{alpha:al,box:eback(prog(t,a-.1,a+.1)),text:prog(t,a,b)})}
}
function penPos(t){
  const ev=[];
  for(let k=0;k<9;k++){const[a,b]=WR(k),w=tw(S.rows[k],{size:32,fam:'G'});ev.push([a,b,p=>[ROWX+TX+w*p,rowY(k)-6]])}
  SEL.forEach((k,j)=>{const[a,b]=CK(j);ev.push([a,b,p=>{const P=checkPath(ROWX,rowY(k)-12,34,p);return P[P.length-1]}])});
  if(t<=ev[0][0])return ev[0][2](0);
  for(let i=0;i<ev.length;i++){const[a,b,f]=ev[i];if(t<=b)return f(prog(t,a,b));const nx=ev[i+1];if(!nx)return f(1);
    if(t<nx[0]){const u=eio(prog(t,b,nx[0])),p0=f(1),p1=nx[2](0);return[lerp(p0[0],p1[0],u),lerp(p0[1],p1[1],u)-Math.sin(u*Math.PI)*30]}}
}
function pen(t){
  const pa=prog(t,.15,.4)*(1-prog(t,5.35,5.7));if(pa<=0)return;const[x,y]=penPos(t);
  ctx.save();ctx.globalAlpha=pa;ctx.translate(x,y);ctx.rotate(.6);
  const nib=[[0,0],[-15,-44],[-11,-90],[11,-90],[15,-44]];ctx.fillStyle=C.cream;ctx.beginPath();nib.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();
  hatch(()=>{nib.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath()},{bbox:[-20,-95,20,0],col:hexA(C.ink,.25),gap:7});
  rpoly(nib,true,{col:C.ink,w:2.5,j:.8,passes:1});rline(0,-4,0,-54,{col:C.ink,w:2,j:.5,passes:1});
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(0,-58,5,0,7);ctx.fill();
  ctx.fillStyle=C.green;ctx.fillRect(-14,-184,28,92);rpoly([[-14,-184],[14,-184],[14,-92],[-14,-92]],true,{col:C.ink,w:2.2,j:.8,passes:1});
  ctx.restore();
}

/* ---------- Scene B (6-13s): 계획 카드 -> worktree 레인 -> 에이전트 ---------- */
function cardBody(j,y,r,a){
  const x0=118,y0=y-64,y1=y+68;
  ctx.save();ctx.globalAlpha*=a;const s=lerp(.92,1,a);ctx.translate((x0+r)/2,y);ctx.scale(s,s);ctx.translate(-(x0+r)/2,-y);
  ctx.fillStyle=hexA(C.ink,.07);ctx.fillRect(x0+8,y0+10,r-x0,y1-y0);
  ctx.fillStyle=C.card;ctx.fillRect(x0,y0,r-x0,y1-y0);
  ctx.fillStyle=C.greenBg;ctx.fillRect(x0,y+6,r-x0,y1-y-6);
  rline(x0+6,y+6,r-6,y+6,{col:C.rule,w:2,j:.6,passes:1});
  txt(IDS[j],146,y+36,{size:17,weight:600,fam:'M',col:C.ink2});
  rline(146,y+54,290,y+54,{col:hexA(C.ink,.22),w:2.4,j:.8,passes:1});rline(302,y+54,352,y+54,{col:hexA(C.ink,.22),w:2.4,j:.8,passes:1});
  const px=r-80,py=y+22;ctx.fillStyle=C.green;ctx.beginPath();ctx.roundRect(px,py,62,26,6);ctx.fill();
  txt('HTML',px+31,py+19,{size:15,weight:800,fam:'M',col:'#fff',align:'center'});
  rpoly([[x0,y0],[r,y0],[r,y1],[x0,y1]],true,{col:C.ink,w:3,j:1});
  ctx.restore();
}
function tracks(t){
  const la=laneAlpha(t);if(la<=0)return;
  SEL.forEach((k,j)=>{

  enc.configure({codec,width:W,height:H,bitrate:14e6,framerate:FPS});
  const NF=DUR*FPS;
  for(let i=0;i<NF;i++){render(i/FPS);const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
    enc.encode(f,{keyFrame:i%60===0});f.close();while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,4));window.__progress=(i+1)/NF}
  await enc.flush();muxer.finalize();window.__mp4=muxer.target.buffer;window.__codec=codec;return muxer.target.buffer.byteLength;
}
async function downloadMP4(){await exportMP4();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([window.__mp4],{type:'video/mp4'}));a.download=`todo-flow-motion-${LANG}.mp4`;a.click()}
window.render=render;window.exportMP4=exportMP4;window.downloadMP4=downloadMP4;
(async()=>{
  try{await Promise.all([document.fonts.load(`800 100px ${PF}`,ALLTXT),document.fonts.load(`600 60px ${PF}`,ALLTXT),document.fonts.load(`700 40px ${GF}`,ALLTXT)])}catch(e){}
  await document.fonts.ready;window.__ready=true;
  if(Q.has('t')){render(parseFloat(Q.get('t')));return}
  if(Q.has('export')){render(0);return}
  let t0=performance.now(),paused=false,pt=0;
  cv.onclick=()=>{paused=!paused;if(!paused)t0=performance.now()-pt*1000};
  (function loop(){if(!paused){pt=((performance.now()-t0)/1000)%DUR;render(pt)}requestAnimationFrame(loop)})();
})();
</script>

    <script>
// 렌더 엔진 — render(ctx, t) 순수 함수.
// 모든 무작위성은 "요소 키 + 정수 프레임 인덱스"에서 파생된 시드(mulberry32)로 만들고
// 호출 순서에 의존하지 않는다. 무작위 전역 함수·시계 함수는 렌더 경로에서 일절 사용하지 않는다.
const HeroEngine = (() => {
  'use strict';
  const CONFIG = HERO_CONFIG;

  // ---- 결정론 도구 -------------------------------------------------------

  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function next() {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let curFrame = 0;
  let curTextAlpha = 1;
  let curBoxes = [];

  // 요소 키 → 시드. 프레임 인덱스가 섞여 프레임마다 미세하게 다른 필압이 된다.
  function prng(key) {
    return mulberry32((fnv1a(key) ^ CONFIG.motion.seed) + curFrame);
  }

  function frameOf(t) {
    return Math.floor(t * CONFIG.export.fps);
  }

  const easeFns = {
    linear: (p) => p,
    easeOutCubic: (p) => 1 - Math.pow(1 - p, 3),
    easeInOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    easeOutBack: (p) => {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
    },
  };

  function ease(name, p) {
    const fn = easeFns[name] || easeFns.linear;
    return fn(clamp01(p));
  }

  function clamp01(v) {
    return Math.min(1, Math.max(0, v));
  }

  function lerp(a, b, s) {
    return a + (b - a) * s;
  }

  function easeAt(name, t, start, dur) {
    return ease(name, (t - start) / dur);
  }

  function withAlpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255;
    const g = (n >> 8) & 255;
    const b = n & 255;
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }

  // ---- 타임라인 ----------------------------------------------------------

  // 오버랩(0.4s)은 인접 씬 사이 5개 경계 중심의 크로스페이드 창(경계 ±0.2s)으로 동작한다.
  // 나가는 씬은 경계까지 1→0.5, 들어오는 씬은 경계에서 0.5로 등장해 합성 alpha가 창 전체에서
  // 항상 1 — 배경 비침·경계 빈 프레임이 없다(④ GAP-R1: 경계 t에서도 두 씬이 0.5+0.5로 렌더).
  // 표시 연장 구간의 local은 씬 경계에서 고정된다(들어오는 씬은 첫 모습, 나가는 씬은 완료 모습).
  // 텍스트는 경계를 기준으로 교차 스왑된다: 나가는 문구는 창 전반부에 사라지고 들어오는
  // 문구는 창 후반부에 나타나 같은 슬롯 문구가 한 프레임에도 공존하지 않는다(bbox 계약).
  function visibleScenes(t) {
    const scenes = CONFIG.scenes;
    const half = CONFIG.motion.overlap / 2;
    const out = [];
    scenes.forEach((scene, i) => {
      const start = scene.start;
      const end = scene.start + scene.dur;
      if (t < start - half - 1e-9 || t > end + half + 1e-9) return;
      let alpha = 1;
      let textAlpha = 1;
      const fadingIn = i > 0 && t < start + half;
      const fadingOut = i < scenes.length - 1 && t > end - half;
      if (fadingIn) {
        const p = (t - (start - half)) / (half * 2);
        alpha = Math.min(alpha, clamp01(p));
        textAlpha = Math.min(textAlpha, clamp01(p * 2 - 1));
      }
      if (fadingOut) {
        const p = (end + half - t) / (half * 2);
        alpha = Math.min(alpha, clamp01(p));
        textAlpha = Math.min(textAlpha, clamp01(p * 2 - 1));
      }
      if (alpha <= 0.002) return;
      let localT = t;
      if (t < start) localT = start;
      if (t > end) localT = end;
      out.push({ scene, index: i, localT: localT - start, p: (localT - start) / scene.dur, alpha, textAlpha });
    });
    return out;
  }

  // 정지시간 계약(§3.2 경계 인식 차감): dur − (앞 오버랩) − (뒤 오버랩) ≥ minReadableSec
  function minReadableReport() {
    const scenes = CONFIG.scenes;
    const ov = CONFIG.motion.overlap;
    return scenes.map((scene, i) => {
      let readable = scene.dur;
      if (i > 0) readable -= ov;
      if (i < scenes.length - 1) readable -= ov;
      return {
        id: scene.id,
        dur: scene.dur,
        readable: Math.round(readable * 100) / 100,
        required: scene.minReadableSec,
        pass: readable >= scene.minReadableSec - 1e-9,
      };
    });
  }

  // ---- 손그림 헬퍼 -------------------------------------------------------

  function strokeStyle(ctx, opts) {
    ctx.strokeStyle = opts.color || CONFIG.palette.ink;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (opts.alpha != null) ctx.globalAlpha *= opts.alpha;
  }

  // 직선을 짧은 선분으로 쪼개 각 점에 시드 고정 지터를 준다. 선굵기는 경로 따라 ±15%.
  function jitterPts(x1, y1, x2, y2, key) {
    const M = CONFIG.motion;
    const len = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(2, Math.round(len / M.strokeSegPx));
    const r = prng('ln:' + key);
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const edge = i === 0 || i === n ? 0.35 : 1;
      pts.push({
        x: x1 + (x2 - x1) * s + (r() - 0.5) * 2 * M.jitterAmpPx * edge,
        y: y1 + (y2 - y1) * s + (r() - 0.5) * 2 * M.jitterAmpPx * edge,
        w: 1 + 0.3 * (r() - 0.5),
      });
    }
    return pts;
  }

  function strokePts(ctx, pts, opts) {
    ctx.save();
    strokeStyle(ctx, opts);
    for (let i = 1; i < pts.length; i++) {
      ctx.beginPath();
      ctx.lineWidth = (opts.width ?? CONFIG.motion.lineWidth) * pts[i].w;
      ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
      ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function line(ctx, x1, y1, x2, y2, opts = {}) {
    const key = opts.key ?? `L${Math.round(x1)},${Math.round(y1)},${Math.round(x2)},${Math.round(y2)}`;
    strokePts(ctx, jitterPts(x1, y1, x2, y2, key), opts);
  }

  function poly(ctx, pts, opts = {}) {
    for (let i = 1; i < pts.length; i++) {
      line(ctx, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y, { ...opts, key: `${opts.key ?? 'P'}:${i}` });
    }
  }

  // 채색은 반투명 단색 1회(마커 느낌) — GIF 팔레트 안정화를 위해 직사각 그대로 둔다.
  function rect(ctx, x, y, w, h, opts = {}) {
    if (opts.fill) {
      ctx.save();
      ctx.globalAlpha *= opts.fillAlpha ?? 1;
      ctx.fillStyle = opts.fill;
      ctx.fillRect(x, y, w, h);
      ctx.restore();
    }
    const k = opts.key ?? `R${Math.round(x)},${Math.round(y)},${Math.round(w)},${Math.round(h)}`;
    line(ctx, x, y, x + w, y, { ...opts, key: `${k}:t` });
    line(ctx, x + w, y, x + w, y + h, { ...opts, key: `${k}:r` });
    line(ctx, x + w, y + h, x, y + h, { ...opts, key: `${k}:b` });
    line(ctx, x, y + h, x, y, { ...opts, key: `${k}:l` });
  }

  function circle(ctx, cx, cy, r, opts = {}) {
    const M = CONFIG.motion;
    const n = 22;
    const r2 = prng('c:' + (opts.key ?? `c${Math.round(cx)},${Math.round(cy)},${Math.round(r)}`));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      const rr = r + (r2() - 0.5) * 2 * M.jitterAmpPx;
      pts.push({ x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr, w: 1 });
    }
    strokePts(ctx, pts, opts);
  }

  function check(ctx, cx, cy, size, opts = {}) {
    const k = opts.key ?? `k${Math.round(cx)},${Math.round(cy)}`;
    line(ctx, cx - size * 0.45, cy + size * 0.05, cx - size * 0.1, cy + size * 0.38, { ...opts, key: `${k}:a` });
    line(ctx, cx - size * 0.1, cy + size * 0.38, cx + size * 0.5, cy - size * 0.35, { ...opts, key: `${k}:b` });
  }

  function arrowHead(ctx, x, y, angle, size, opts = {}) {
    const k = opts.key ?? `h${Math.round(x)},${Math.round(y)}`;
    const a1 = angle + Math.PI - 0.45;
    const a2 = angle + Math.PI + 0.45;
    line(ctx, x, y, x + Math.cos(a1) * size, y + Math.sin(a1) * size, { ...opts, key: `${k}:1` });
    line(ctx, x, y, x + Math.cos(a2) * size, y + Math.sin(a2) * size, { ...opts, key: `${k}:2` });
  }

  function pathLength(pts) {
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return total;
  }

  // 경로를 steppx 간격으로 보간 — {x, y, d(누적 거리)} 목록
  function resamplePath(pts, step) {
    const out = [{ x: pts[0].x, y: pts[0].y, d: 0 }];
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1];
      const b = pts[i];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      const n = Math.max(1, Math.round(segLen / step));
      for (let j = 1; j <= n; j++) {
        out.push({ x: lerp(a.x, b.x, j / n), y: lerp(a.y, b.y, j / n), d: out[out.length - 1].d + segLen / n });
      }
    }
    return out;
  }

  // 길이가 자라는 점선 궤적 — progress가 경로 길이의 앞부분까지만 점선을 그린다.
  // 대시 위상은 요소 키에서 파생(시간과 무관)되어 그려진 부분은 고정된다.
  function dashTrail(ctx, pathPts, progress, opts = {}) {
    const on = opts.on ?? 16;
    const off = opts.off ?? 13;
    const fine = resamplePath(pathPts, 4);
    const target = pathLength(pathPts) * clamp01(progress);
    const period = on + off;
    const phase = prng('d:' + (opts.key ?? 'trail'))() * period;
    ctx.save();
    strokeStyle(ctx, opts);
    ctx.lineWidth = opts.width ?? 4;
    ctx.beginPath();
    let pen = false;
    for (const p of fine) {
      if (p.d > target) break;
      const inOn = (p.d + phase) % period < on;
      if (inOn && !pen) {
        ctx.moveTo(p.x, p.y);
        pen = true;
      } else if (inOn && pen) {
        ctx.lineTo(p.x, p.y);
      } else {
        pen = false;
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---- 텍스트 ------------------------------------------------------------

  function textBoxOf(spec, m) {
    const w = m.actualBoundingBoxRight != null ? m.actualBoundingBoxLeft + m.actualBoundingBoxRight : m.width;
    const asc = m.actualBoundingBoxAscent || spec.px * 0.78;
    const desc = m.actualBoundingBoxDescent || spec.px * 0.22;
    const x0 = spec.align === 'left' ? spec.x : spec.align === 'right' ? spec.x - w : spec.x - w / 2;
    const y0 = spec.y - asc;
    if (!spec.rotate) return { text: spec.text, x: x0, y: y0, w, h: asc + desc };
    const cos = Math.cos(spec.rotate);
    const sin = Math.sin(spec.rotate);
    const cx = spec.x;
    const cy = spec.y;
    const corners = [
      [x0, y0], [x0 + w, y0], [x0, y0 + asc + desc], [x0 + w, y0 + asc + desc],
    ].map(([px, py]) => {
      const dx = px - cx;
      const dy = py - cy;
      return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
    });
    const xs = corners.map((c) => c[0]);
    const ys = corners.map((c) => c[1]);
    const bx = Math.min(...xs);
    const by = Math.min(...ys);
    return { text: spec.text, x: bx, y: by, w: Math.max(...xs) - bx, h: Math.max(...ys) - by };
  }

  // 텍스트 그리기 + bbox 반환·기록(내보내기 품질 검사용). 보이지 않는 텍스트는 기록하지 않는다.
  function text(ctx, spec) {
    if (curTextAlpha * (spec.alpha ?? 1) <= 0.001) return null;
    const T = CONFIG.type;
    ctx.save();
    ctx.font = `${spec.weight || 400} ${spec.px}px ${spec.code ? T.codeFamily : T.fontFamily}`;
    ctx.fillStyle = spec.color || CONFIG.palette.ink;
    ctx.textAlign = spec.align || 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha *= spec.alpha ?? 1;
    const m = ctx.measureText(spec.text);
    const box = textBoxOf(spec, m);
    if (spec.rotate) {
      ctx.translate(spec.x, spec.y);
      ctx.rotate(spec.rotate);
      ctx.fillText(spec.text, 0, 0);
    } else {
      ctx.fillText(spec.text, spec.x, spec.y);
    }
    ctx.restore();
    curBoxes.push(box);
    return box;
  }

  // 스케일·회전 변형 안에서 스트로크를 그리기 위한 래퍼(텍스트는 넣지 않는다 — bbox 왜곡 방지)
  function withTransform(ctx, x, y, scale, rotate, drawFn) {
    ctx.save();
    ctx.translate(x, y);
    if (rotate) ctx.rotate(rotate);
    if (scale != null && scale !== 1) ctx.scale(scale, scale);
    drawFn();
    ctx.restore();
  }

  // ---- 렌더 ---------------------------------------------------------------

  function render(ctx, t) {
    const L = CONFIG.layout;
    curFrame = frameOf(t);
    curBoxes = [];
    ctx.save();
    ctx.fillStyle = CONFIG.palette.paper;
    ctx.fillRect(0, 0, L.width, L.height);
    ctx.restore();
    for (const v of visibleScenes(t)) {
      const fn = HeroScenes[v.scene.visual];
      if (!fn) throw new Error('알 수 없는 비주얼: ' + v.scene.visual);
      ctx.save();
      ctx.globalAlpha = v.alpha;
      curTextAlpha = v.textAlpha;
      fn(ctx, v.scene, { t: v.localT, p: v.p });
      ctx.restore();
    }
    curTextAlpha = 1;
  }

  function getTextBoxes() {
    return curBoxes;
  }

  async function whenReady() {
    await document.fonts.load("400 48px Gaegu");
    await document.fonts.load("700 48px Gaegu");
    await document.fonts.ready;
  }

  return Object.freeze({
    render,
    getTextBoxes,
    whenReady,
    visibleScenes,
    minReadableReport,
    frameOf,
    ease,
    lerp,
    clamp01,
    easeAt,
    withAlpha,
    line,
    poly,
    rect,
    circle,
    check,
    arrowHead,
    dashTrail,
    text,
    withTransform,
    prng,
  });
})();

    <script>
// 장면 드로잉 — S0(타이틀)·S1(망치)·S2(판정 게이트).
// 모든 좌표·수치는 js/config.js의 상수만 읽고, 그리기는 HeroEngine 헬퍼만 사용한다.
// 텍스트는 항상 시각 요소보다 나중에 그려 최상단에 놓인다.
const HeroScenes = {};

// 장면 공통 문구 슬롯 — title 슬롯(S0·S5)과 headline 슬롯(S1~S4)만 있다.
// opts.bodyAlpha는 S5의 루프 이음새 스왑(요약줄 페이드아웃)에서만 1 미만이 된다.
function heroSceneText(ctx, scene, opts = {}) {
  const E = HeroEngine;
  const L = HERO_CONFIG.layout;
  const T = HERO_CONFIG.type;
  const isTitle = scene.params.slot === 'title';
  const title = E.text(ctx, {
    text: scene.headline,
    x: L.width / 2,
    y: isTitle ? L.titleY : L.headlineY,
    px: isTitle ? T.titlePx : T.headlinePx,
    weight: 700,
  });
  const body = E.text(ctx, {
    text: scene.body,
    x: L.width / 2,
    y: isTitle ? L.titleSubY : L.bodyY,
    px: T.bodyPx,
    alpha: opts.bodyAlpha,
  });
  return { title, body };
}

// 주인공 카드 — 같은 카드가 S1~S3에서 살아남으며 이동한다(장면 간 연속성 매개체).
function heroCard(ctx, cx, cy, w, h, opts = {}) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const x0 = cx - w / 2;
  const y0 = cy - h / 2;
  E.rect(ctx, x0, y0, w, h, {
    key: opts.key || 'card',
    width: opts.width || 5,
    color: opts.color || P.ink,
    fill: P.paper,
    fillAlpha: opts.alpha,
    alpha: opts.alpha,
  });
  const k = opts.key || 'card';
  E.line(ctx, x0 + w - 56, y0, x0 + w, y0 + 56, { key: `${k}:fold`, width: 3.5, color: E.withAlpha(P.ink, 0.6), alpha: opts.alpha });
  E.line(ctx, x0 + w - 56, y0, x0 + w - 56, y0 + 56, { key: `${k}:fold2`, width: 3.5, color: E.withAlpha(P.ink, 0.4), alpha: opts.alpha });
}

// ---- S0 타이틀 -----------------------------------------------------------

HeroScenes.title = function drawTitleScene(ctx, scene, local) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const boxes = heroSceneText(ctx, scene);
  // 크로스페이드 텍스트 스왑 중에는 문구가 안 보일 수 있다(textAlpha 0) — 그때 장식도 생략.
  const u = boxes.title;
  if (u) {
    const uy = u.y + u.h + 18;
    E.line(ctx, u.x + 6, uy, u.x + u.w - 6, uy, {
      key: `${scene.id}-underline`,
      width: 18,
      color: E.withAlpha(P.accent, 0.3),
    });
    // 연필이 제목 스트로크를 살짝 다시 그리는 미세 모션 — S0에서만 진행
    if (scene.id === 'S0') {
      const prog = E.ease('easeInOutCubic', local.p);
      E.line(ctx, u.x + 6, uy + 3, u.x + 6 + (u.w - 12) * prog, uy + 3, {
        key: `${scene.id}-pencil`,
        width: 3.5,
        color: E.withAlpha(P.ink, 0.5),
      });
    }
  }
};

// ---- S1 망치 -------------------------------------------------------------

// 세 망치는 전부 같은 크기 — 단순한 일엔 크고, 큰 일엔 작게 보이는 것이 핵심 연출.
function drawHammer(ctx, pr, cx, cardTopY, i, t) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const hm = pr.hammer;
  const hitT = hm.times[i];
  let angle;
  if (t < hitT) {
    angle = hm.restAngle;
  } else if (t < hitT + hm.swingDur) {
    angle = E.lerp(hm.restAngle, hm.hitAngle, E.ease('easeOutCubic', (t - hitT) / hm.swingDur));
  } else {
    angle = E.lerp(hm.hitAngle, hm.restAngle, E.ease('easeInOutCubic', E.clamp01((t - hitT - hm.swingDur) / 0.55)));
  }
  E.withTransform(ctx, cx, hm.pivotY, 1, angle, () => {
    E.line(ctx, 0, 0, 0, hm.size, { key: `s1-hammer-handle-${i}`, width: 9, color: P.ink });
    E.rect(ctx, -86, hm.size, 172, 96, { key: `s1-hammer-head-${i}`, width: 6, color: P.ink, fill: P.paper });
  });
  // 타격 임팩트 별 — 맞은 자리에서 잠깐 퍼지는 짧은 선 3개
  const hitDone = hitT + hm.swingDur * 0.75;
  const starP = (t - hitDone) / 0.45;
  if (starP > 0 && starP < 1) {
    for (let k = 0; k < 3; k++) {
      const ang = -Math.PI / 2 + (k - 1) * 0.6;
      const reach = 26 + 34 * (1 - starP);
      E.line(ctx, cx + Math.cos(ang) * 26, cardTopY + Math.sin(ang) * 26, cx + Math.cos(ang) * reach, cardTopY + Math.sin(ang) * reach, {
        key: `s1-star-${i}-${k}`,
        width: 4,
        color: P.accent,
        alpha: 1 - starP,
      });
    }
  }
}

HeroScenes.hammers = function drawHammers(ctx, scene, local) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const pr = scene.params;
  const L = HERO_CONFIG.layout;
  E.line(ctx, L.marginX + 40, pr.floorY, L.width - L.marginX - 40, pr.floorY, {
    key: 's1-floor',
    color: E.withAlpha(P.ink, 0.7),
    width: 5,
  });
  pr.cards.forEach((card, i) => {
    const isHero = !!card.hero;
    const fall = isHero ? 0 : E.easeAt('easeInOutCubic', local.t, pr.othersFall.start, pr.othersFall.dur);
    const move = isHero ? E.easeAt('easeInOutCubic', local.t, pr.heroMove.start, pr.heroMove.end - pr.heroMove.start) : 0;
    const cx = isHero ? E.lerp(card.x, pr.heroMove.toX, move) : card.x;
    const cy = pr.floorY - card.h / 2 + fall * 620;
    const alpha = 1 - fall;
    drawHammer(ctx, pr, card.x, cy - card.h / 2, i, local.t);
    heroCard(ctx, cx, cy, card.w, card.h, { key: `s1-card-${i}`, color: isHero ? P.accent : P.ink, width: isHero ? 6 : 5, alpha });
    // 라벨은 제자리에서 사라지고 카드 모양만 낙하한다(텍스트 잘림 계약)
    E.text(ctx, { text: card.label, x: cx, y: pr.labelY, px: HERO_CONFIG.type.minBodyPx + 4, alpha: 1 - E.clamp01(fall / 0.7) });
  });
  // 주인공 카드가 S2 게이트(왼쪽)로 향하는 길이가 자라는 점선
  const tp = E.clamp01((local.t - pr.trail.start) / (scene.dur - pr.trail.start));
  if (tp > 0) {
    E.dashTrail(ctx, [{ x: 960, y: 700 }, { x: 480, y: 735 }, pr.trail.to], tp, { key: 's1-trail', color: P.ink, width: 4 });
  }
  heroSceneText(ctx, scene);
};

// ---- S2 판정 게이트 -------------------------------------------------------

HeroScenes.gate = function drawGate(ctx, scene, local) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const pr = scene.params;
  const g = pr.gate;
  // 아치형 게이트 — 기둥 2개와 상단 보, 바닥은 열려 있다
  E.line(ctx, g.cx - g.halfW, g.floorY, g.cx - g.halfW, g.topY, { key: 's2-gate-l', width: 7, color: P.ink });
  E.line(ctx, g.cx + g.halfW, g.floorY, g.cx + g.halfW, g.topY, { key: 's2-gate-r', width: 7, color: P.ink });
  E.line(ctx, g.cx - g.halfW, g.topY, g.cx + g.halfW, g.topY, { key: 's2-gate-top', width: 7, color: P.ink });
  E.line(ctx, g.cx - 34, g.topY - 62, g.cx, g.topY, { key: 's2-gate-hopper-l', width: 5, color: P.ink });
  E.line(ctx, g.cx + 34, g.topY - 62, g.cx, g.topY, { key: 's2-gate-hopper-r', width: 5, color: P.ink });

  // 카드 진입 → 슬롯 통과
  const enter = E.easeAt('easeInOutCubic', local.t, 0, pr.card.enterEnd);
  const exitP = E.easeAt('easeInOutCubic', local.t, pr.exit.start, pr.exit.dur);
  const cardX = E.lerp(E.lerp(pr.card.from.x, pr.card.slot.x, enter), pr.exit.to.x, exitP);
  const cardY = E.lerp(pr.card.slot.y, pr.exit.to.y, exitP);

  // 스탬프 헤드 — 카드 위에서 내려와 XL을 찍는다
  const drop = E.easeAt('easeOutCubic', local.t, pr.stamp.dropAt - 0.18, 0.18);
  const lift = E.easeAt('easeInOutCubic', local.t, pr.stamp.dropAt + pr.stamp.dropDur, 0.4);
  const stampY = E.lerp(g.topY - 40, cardY - pr.card.h / 2 + 10, drop) - lift * 40;
  if (local.t > pr.stamp.dropAt - 0.18 && local.t < pr.exit.start + 0.2) {
    E.withTransform(ctx, g.cx, stampY, 1, 0, () => {
      E.line(ctx, 0, -96, 0, -22, { key: 's2-stamp-handle', width: 8, color: P.ink });
      E.rect(ctx, -62, -22, 124, 46, { key: 's2-stamp-head', width: 6, color: P.ink, fill: P.paper });
    });
  }

  heroCard(ctx, cardX, cardY, pr.card.w, pr.card.h, { key: 's2-card', color: P.accent, width: 6 });

  // 찍힌 XL — 카드와 함께 움직이다가 퇴장 전반에 화면 안에서 사라진다(텍스트 잘림 계약)
  const xlP = E.clamp01((local.t - (pr.stamp.dropAt + pr.stamp.dropDur * 0.6)) / 0.18);
  const xlFade = 1 - E.clamp01((exitP - 0.3) / 0.12);
  if (xlP > 0 && xlFade > 0) {
    E.text(ctx, { text: pr.stamp.label, x: cardX, y: cardY + 44, px: pr.stamp.px, weight: 700, color: P.accent, rotate: -0.1, alpha: xlP * xlFade });
  }

  // 작은 배지 — CONFIG.scenes 배지 라벨, 1회 등장(확대 없음)
  const badgeP = E.clamp01((local.t - pr.badgeAt) / 0.25);
  if (badgeP > 0) {
    E.rect(ctx, pr.badge.x - pr.badge.w / 2, pr.badge.y - pr.badge.h / 2, pr.badge.w, pr.badge.h, {
      key: 's2-badge',
      width: 4,
      color: P.ink,
      fill: P.paper,
      alpha: badgeP,
    });
    E.text(ctx, { text: pr.badge.label, x: pr.badge.x, y: pr.badge.y + 17, px: HERO_CONFIG.type.minBodyPx, code: true, alpha: badgeP });
  }

  // S3 레일로 이어지는 점선 — 카드가 나가기 직전부터 자란다
  const tp = E.clamp01((local.t - pr.trail.start) / (scene.dur - pr.trail.start));
  if (tp > 0) {
    E.dashTrail(ctx, [{ x: pr.card.slot.x, y: 700 }, { x: 80, y: 745 }, pr.trail.to], tp, { key: 's2-trail', color: P.ink, width: 4 });
  }
  heroSceneText(ctx, scene);
};

    <script>
// 장면 드로잉 후반 — S3(레일)·S4(서류철)·S5(완결·루프).
// scenes.js에서 650줄 경고 도달에 대비해 S3~S5를 이 파일로 분리한다(계획 §3.5).

// ---- S3 레일 -------------------------------------------------------------

// 카드 x 좌표: 진입 → 정거장별 정지·이동 → 퇴장(오른쪽 미끄러짐)
function railCardX(pr, t, dur) {
  const E = HeroEngine;
  const st = pr.stations;
  const a = pr.arrivals;
  if (t < pr.card.enterEnd) return E.lerp(-320, st[0].x, E.ease('easeInOutCubic', t / pr.card.enterEnd));
  for (let i = 0; i < st.length - 1; i++) {
    const leaveT = a[i] + pr.dwell;
    if (t < leaveT) return st[i].x;
    if (t < a[i + 1]) return E.lerp(st[i].x, st[i + 1].x, E.ease('easeInOutCubic', (t - leaveT) / (a[i + 1] - leaveT)));
  }
  if (t < pr.exit.start) return st[st.length - 1].x;
  return E.lerp(st[st.length - 1].x, pr.exit.toX, E.ease('easeInOutCubic', (t - pr.exit.start) / (dur - pr.exit.start)));
}

// 정거장마다 색이 다른 펜·스탬프가 내려와 체크 도장을 찍는다
function stampGarnish(ctx, pr, st, i, t) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const a = pr.arrivals[i];
  const dropT = a - 0.16;
  if (t < dropT || t > a + 0.5) return;
  const drop = E.easeAt('easeOutCubic', t, dropT, 0.16);
  const lift = E.easeAt('easeInOutCubic', t, a + 0.08, 0.4);
  const sy = E.lerp(pr.rail.y - 420, pr.cardCy - pr.card.h / 2 + 6, drop) - lift * 46;
  E.withTransform(ctx, st.x, sy, 1, 0, () => {
    E.line(ctx, 0, -70, 0, -18, { key: `s3-stamp-handle-${i}`, width: 7, color: P.ink });
    E.rect(ctx, -52, -18, 104, 38, { key: `s3-stamp-head-${i}`, width: 5, color: P.ink, fill: P.paper });
  });
}

HeroScenes.rail = function drawRail(ctx, scene, local) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const pr = scene.params;
  const T = HERO_CONFIG.type;
  E.line(ctx, pr.rail.x1, pr.rail.y, pr.rail.x2, pr.rail.y, { key: 's3-rail', color: E.withAlpha(P.ink, 0.75), width: 6 });
  pr.stations.forEach((st, i) => {
    stampGarnish(ctx, pr, st, i, local.t);
    E.circle(ctx, st.x, pr.rail.y, 16, { key: `s3-st-${i}`, width: 5, color: P.ink, fill: P.paper });
    E.text(ctx, { text: st.label, x: st.x, y: pr.labelY, px: T.minBodyPx + 6 });
  });

  const cx = railCardX(pr, local.t, scene.dur);
  const exitP = E.easeAt('easeInOutCubic', local.t, pr.exit.start, scene.dur - pr.exit.start);
  E.withTransform(ctx, cx, pr.cardCy, 1, exitP * pr.exit.tilt, () => {
    heroCard(ctx, 0, 0, pr.card.w, pr.card.h, { key: 's3-card', color: P.accent, width: 6 });
  });

  // 도장 누적 — 정거장마다 그 펜 색의 체크가 카드에 남는다
  pr.stations.forEach((st, i) => {
    const pop = E.easeAt('easeOutBack', local.t, pr.arrivals[i] + 0.08, 0.3);
    if (pop <= 0) return;
    const [ox, oy] = pr.checkOffsets[i];
    E.withTransform(ctx, cx + ox, pr.cardCy + oy, 0.6 + 0.4 * pop, 0, () => {
      E.check(ctx, 0, 0, 64, { key: `s3-chk-${i}`, width: 7, color: P[st.pen] });
    });
  });

  // 카드가 지나간 만큼 길어지는 점선 궤적(레일 아래 평행선)
  const tp = E.clamp01((cx - pr.rail.x1) / (pr.rail.x2 - pr.rail.x1));
  if (tp > 0) {
    E.dashTrail(ctx, [{ x: pr.rail.x1, y: pr.rail.y + 30 }, { x: pr.rail.x2, y: pr.rail.y + 30 }], tp, {
      key: 's3-trail',
      color: P.accent,
      width: 3.5,
      on: 13,
      off: 11,
    });
  }
  heroSceneText(ctx, scene);
};

// ---- 서류철(S4·S5 공용) ---------------------------------------------------

// 폴더 본체 스트로크 + 완료 체크. 라벨 텍스트는 bbox 정합을 위해 변형 밖 folderLabel로 그린다.
function heroFolder(ctx, E, P, f, opts = {}) {
  const x0 = f.cx - f.w / 2;
  const y0 = f.cy - f.h / 2 + (opts.settleDy || 0);
  const alpha = opts.alpha;
  // 탭(위쪽 귀퉁이)
  E.rect(ctx, x0 + 36, y0 - 40, 190, 44, { key: `${opts.key}:tab`, width: 5, color: P.ink, fill: P.paper, fillAlpha: alpha, alpha });
  E.rect(ctx, x0, y0, f.w, f.h, { key: `${opts.key}:body`, width: 6, color: P.ink, fill: P.paper, fillAlpha: alpha, alpha });
  E.line(ctx, x0 + 14, y0 + 74, x0 + f.w - 14, y0 + 74, { key: `${opts.key}:fold`, width: 3.5, color: E.withAlpha(P.ink, 0.45), alpha });
  if (opts.checked) {
    E.check(ctx, f.cx + 130, f.cy + 74, 56, { key: `${opts.key}:chk`, width: 7, color: P.accent2, alpha });
  }
}

// state.json 라벨 — 항상 월드 좌표(변형 없는 컨텍스트)에서 그린다.
function folderLabel(ctx, E, f, opts = {}) {
  E.text(ctx, { text: f.label, x: f.cx, y: f.cy + 92 + (opts.settleDy || 0), px: HERO_CONFIG.type.minBodyPx, code: true, alpha: opts.alpha });
}

// ---- S4 서류철·영수증 -----------------------------------------------------

HeroScenes.folder = function drawFolder(ctx, scene, local) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const pr = scene.params;
  const T = HERO_CONFIG.type;
  // 그룹이 화면 중앙으로 미끄러진다 — 텍스트 bbox 정합을 위해 ctx 이동 대신 x에 더한다
  const dx = E.lerp(pr.centerMove.dx, 0, E.easeAt('easeInOutCubic', local.t, pr.centerMove.start, pr.centerMove.end - pr.centerMove.start));
  const pop = E.easeAt('easeOutBack', local.t, 0, pr.settle.dur);
  E.withTransform(ctx, pr.folder.cx, pr.folder.cy, 0.94 + 0.06 * pop, 0, () => {
    heroFolder(ctx, E, P, { ...pr.folder, cx: 0, cy: 0 }, { key: 's4-folder' });
  });
  folderLabel(ctx, E, pr.folder, { alpha: E.clamp01(local.t / 0.3) });

  pr.slips.rows.forEach((row, i) => {
    const t0 = pr.slips.times[i];
    const popP = E.easeAt('easeOutBack', local.t, t0, pr.slips.popDur);
    if (popP <= 0) return;
    const sy = pr.slips.y0 + i * pr.slips.gapY;
    const sx = pr.slips.cx + dx;
    const tilt = (i % 2 === 0 ? -1 : 1) * 0.022;
    E.withTransform(ctx, sx, sy, 0.6 + 0.4 * popP, tilt, () => {
      E.rect(ctx, -pr.slips.w / 2, -pr.slips.h / 2, pr.slips.w, pr.slips.h, {
        key: `s4-slip-${i}`,
        width: 4,
        color: P.ink,
        fill: P.paper,
      });
    });
    E.text(ctx, { text: row, x: sx - pr.slips.w / 2 + 46, y: sy + 17, px: T.minBodyPx + 4, align: 'left', alpha: E.clamp01((local.t - t0) / 0.3) });
    E.check(ctx, sx + pr.slips.w / 2 - 64, sy, 46, { key: `s4-slip-chk-${i}`, width: 6, color: P.accent2, alpha: E.clamp01((local.t - t0 - 0.12) / 0.3) });
  });

  heroSceneText(ctx, scene);
};

// ---- S5 완결·루프 ----------------------------------------------------------

HeroScenes.complete = function drawComplete(ctx, scene, local) {
  const E = HeroEngine;
  const P = HERO_CONFIG.palette;
  const pr = scene.params;
  const L = HERO_CONFIG.layout;
  const T = HERO_CONFIG.type;
  // 루프 이음새 스왑(GAP-1): 요약줄은 온전히 읽힌 뒤(hold.dur) 사라지고,
  // 완전히 사라진 시점(taglineSwapAt)에 S0 태그라인이 같은 슬롯에 등장한다.
  const hold = pr.hold;
  const summaryFade = 1 - E.clamp01((local.t - hold.dur) / hold.summaryFadeDur);
  const boxes = heroSceneText(ctx, scene, { bodyAlpha: summaryFade });
  // S5 전용 시각 요소(흐름 레일·폴더)는 마지막 fadeDur에 걸쳐 소멸 — 프레임 479에는 없다.
  const visualFade = 1 - E.clamp01((local.t - hold.dur) / hold.fadeDur);

  // 흐름 다이어그램 한 줄 — drawEnd(초)까지 완성
  const fp = E.clamp01(local.t / pr.flow.drawEnd);
  const step = (pr.flow.x2 - pr.flow.x1) / (pr.flow.nodes - 1);
  if (fp > 0 && visualFade > 0) {
    E.line(ctx, pr.flow.x1, pr.flow.y, pr.flow.x1 + (pr.flow.x2 - pr.flow.x1) * fp, pr.flow.y, {
      key: 's5-flow',
      width: 5,
      color: E.withAlpha(P.accent2, 0.85),
      alpha: visualFade,
    });
    for (let i = 0; i < pr.flow.nodes; i++) {
      const nx = pr.flow.x1 + step * i;
      const nodeP = E.clamp01(fp * (pr.flow.nodes - 1) - i + 1);
      if (nodeP <= 0) continue;
      ctx.save();
      ctx.globalAlpha *= nodeP * visualFade;
      ctx.fillStyle = P.accent2;
      ctx.beginPath();
      ctx.arc(nx, pr.flow.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      if (i < pr.flow.nodes - 1 && nodeP >= 1) {
        E.arrowHead(ctx, nx + step / 2 + step * 0.32, pr.flow.y, 0, 16, {
          key: `s5-arrow-${i}`,
          width: 4,
          color: P.accent2,
          alpha: visualFade,
        });
      }
    }
  }

  // 완성 서류철이 흐름선 위에 착지
  const settleP = E.easeAt('easeInOutCubic', local.t, 0, pr.settle.dur);
  const settleDy = (1 - settleP) * 20;
  heroFolder(ctx, E, P, { ...pr.folder, cy: pr.folder.cy + settleDy }, { key: 's5-folder', settleDy, checked: true, alpha: visualFade });
  folderLabel(ctx, E, { ...pr.folder, cy: pr.folder.cy + settleDy }, { alpha: visualFade });

  // S0과 동일한 마커 언더라인(정적) — 루프 이음새 구도 일치.
  // 페이드인 전반부는 문구가 아직 안 보이므로(textAlpha 0) 언더라인도 생략한다.
  const u = boxes.title;
  if (u) {
    E.line(ctx, u.x + 6, u.y + u.h + 18, u.x + u.w - 6, u.y + u.h + 18, {
      key: 's5-underline',
      width: 18,
      color: E.withAlpha(P.accent, 0.3),
    });
  }

  // S0 태그라인 스왑 — 요약줄이 완전히 사라진 뒤 같은 부제 슬롯에 등장해 프레임 0과 동일 구도로 수렴
  const tagP = E.clamp01((local.t - hold.taglineSwapAt) / hold.taglineFadeDur);
  if (tagP > 0) {
    E.text(ctx, { text: HERO_CONFIG.meta.tagline, x: L.width / 2, y: L.titleSubY, px: T.bodyPx, alpha: tagP });
  }
};

</script>
    <script>
// 재생 제어 — 재생·일시정지·반복·스크러버. 렌더는 항상 t의 순수 함수라 결정론이 깨지지 않는다.
// 색·폭 등 UI 수치도 CONFIG에서 CSS 사용자 정의 속성으로 주입한다(하드코딩 금지).
(() => {
  'use strict';
  const CONFIG = HERO_CONFIG;
  const canvas = document.getElementById('hero-canvas');
  const btn = document.getElementById('btn-play');
  const loopChk = document.getElementById('chk-loop');
  const scrub = document.getElementById('scrub');
  const stateEl = document.getElementById('playback-state');
  const timeEl = document.getElementById('time-label');
  const ctx = canvas.getContext('2d');

  canvas.width = CONFIG.layout.width;
  canvas.height = CONFIG.layout.height;
  scrub.max = String(CONFIG.meta.loopSeconds);
  scrub.step = String(1 / CONFIG.export.fps);

  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--paper', CONFIG.palette.paper);
  rootStyle.setProperty('--ink', CONFIG.palette.ink);
  rootStyle.setProperty('--accent', CONFIG.palette.accent);
  rootStyle.setProperty('--font-body', CONFIG.type.fontFamily);
  // 제품명·접근성 설명은 CONFIG 단일 출처에서 주입한다 — HTML의 정적 title·라벨은
  // JS 주입 전 폴백이며 장면 문구는 아니다(④ GAP-R3: 주석 정확화).
  document.title = CONFIG.meta.pageTitle;
  canvas.setAttribute('aria-label', CONFIG.meta.canvasLabel);

  const PLAYING_TEXT = '재생 중';
  const PAUSED_TEXT = '일시정지';
  const st = { playing: false, t: 0, last: 0, raf: 0 };

  function syncScrub() {
    scrub.value = String(st.t);
  }

  function syncLabels() {
    stateEl.textContent = st.playing ? PLAYING_TEXT : PAUSED_TEXT;
    btn.textContent = st.playing ? '❚❚ 일시정지' : '▶ 재생';
    btn.setAttribute('aria-pressed', String(st.playing));
    timeEl.textContent = `${st.t.toFixed(2)}초 · 프레임 ${HeroEngine.frameOf(st.t)}`;
  }

  function renderAt(t) {
    st.t = t;
    HeroEngine.render(ctx, t);
    syncScrub();
    syncLabels();
  }

  function tick(now) {
    if (!st.playing) return;
    const dt = Math.min((now - st.last) / 1000, 0.25); // 탭 복귀 등 비정상 점프 방지
    st.last = now;
    let t = st.t + dt;
    const total = CONFIG.meta.loopSeconds;
    if (t >= total) {
      if (loopChk.checked) {
        t -= total;
      } else {
        renderAt(total - 1 / CONFIG.export.fps);
        setPlaying(false);
        return;
      }
    }
    renderAt(t);
    if (st.playing) st.raf = requestAnimationFrame(tick);
  }

  function setPlaying(p) {
    if (p === st.playing) {
      syncLabels();
      return;
    }
    st.playing = p;
    if (p) {
      st.last = performance.now();
      st.raf = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(st.raf);
    }
    syncLabels();
  }

  btn.addEventListener('click', () => setPlaying(!st.playing));

  // 스크러버 — input 이벤트에서 render(t)를 동기 호출한다(자동화 검증 계약 §3.3-b).
  scrub.addEventListener('input', () => {
    renderAt(parseFloat(scrub.value));
    if (st.playing) st.last = performance.now();
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) setPlaying(false);

  HeroEngine.whenReady().then(() => {
    renderAt(0);
    window.HERO_READY = true;
  });

  // 자동화 검증이 읽는 읽기 전용 스냅샷
  window.HeroControls = Object.freeze({
    getState: () => Object.freeze({ t: st.t, playing: st.playing, loop: loopChk.checked }),
  });
})();

</script>
